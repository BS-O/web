<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件下载站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }
        
        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .file-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }
        
        .file-icon {
            font-size: 3em;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .file-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            word-break: break-all;
        }
        
        .file-size {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
        }
        
        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: opacity 0.3s ease;
            text-decoration: none;
            text-align: center;
            display: inline-block;
            font-weight: 600;
        }
        
        .download-btn:hover {
            opacity: 0.9;
        }
        
        .download-btn:active {
            opacity: 0.8;
        }
        
        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
        }
        
        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .empty-state h2 {
            font-size: 1.8em;
            margin-bottom: 10px;
        }
        
        .empty-state p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .footer {
            text-align: center;
            color: white;
            opacity: 0.7;
            margin-top: 50px;
            font-size: 0.9em;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📥 文件下载站</h1>
            <p>从 GitHub main 分支获取文件</p>
        </div>
        
        <div id="loading" class="loading">
            ⏳ 正在加载文件列表...
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="empty" class="empty-state" style="display: none;">
            <div class="empty-state-icon">📁</div>
            <h2>暂无文件</h2>
            <p>files 文件夹中还没有任何文件</p>
        </div>
        
        <div id="filesGrid" class="files-grid"></div>
        
        <div class="footer">
            <p>🔗 从 GitHub 仓库 <a href="https://github.com/BS-O/web" target="_blank" style="color: white; text-decoration: underline;">BS-O/web</a> 的 main 分支获取</p>
        </div>
    </div>
    
    <script>
        // GitHub API 配置
        const GITHUB_OWNER = 'BS-O';
        const GITHUB_REPO = 'web';
        const GITHUB_BRANCH = 'main';
        const FILES_PATH = 'files';
        
        // 文件类型图标映射
        const fileIcons = {
            'pdf': '📄',
            'doc': '📝',
            'docx': '📝',
            'xls': '📊',
            'xlsx': '📊',
            'ppt': '🎯',
            'pptx': '🎯',
            'zip': '🗜️',
            'rar': '🗜️',
            '7z': '🗜️',
            'exe': '⚙️',
            'apk': '📱',
            'dmg': '💾',
            'mp3': '🎵',
            'mp4': '🎬',
            'jpg': '🖼️',
            'jpeg': '🖼️',
            'png': '🖼️',
            'gif': '🖼️',
            'txt': '📋',
            'json': '⚙️',
            'default': '📦'
        };
        
        // 获取文件扩展名
        function getFileExtension(filename) {
            return filename.split('.').pop().toLowerCase();
        }
        
        // 获取文件图标
        function getFileIcon(filename) {
            const ext = getFileExtension(filename);
            return fileIcons[ext] || fileIcons['default'];
        }
        
        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }
        
        // 加载文件列表
        async function loadFiles() {
            try {
                const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILES_PATH}?ref=${GITHUB_BRANCH}`;
                
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('empty').style.display = 'block';
                        return;
                    }
                    throw new Error(`API 错误: ${response.status}`);
                }
                
                const files = await response.json();
                document.getElementById('loading').style.display = 'none';
                
                // 过滤出文件（排除文件夹）
                const fileList = files.filter(item => item.type === 'file');
                
                if (fileList.length === 0) {
                    document.getElementById('empty').style.display = 'block';
                    return;
                }
                
                // 生成文件卡片
                const filesGrid = document.getElementById('filesGrid');
                filesGrid.innerHTML = fileList.map(file => `
                    <div class="file-card">
                        <div class="file-icon">${getFileIcon(file.name)}</div>
                        <div class="file-name">${escapeHtml(file.name)}</div>
                        <div class="file-size">${formatFileSize(file.size)}</div>
                        <a href="${file.download_url}" download="${file.name}" class="download-btn">
                            ⬇️ 下载
                        </a>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('加载文件失败:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = `❌ 加载失败: ${error.message}`;
            }
        }
        
        // HTML 转义（防止 XSS）
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        
        // 页面加载完成后执行
        window.addEventListener('DOMContentLoaded', loadFiles);
    </script>
</body>
</html>
